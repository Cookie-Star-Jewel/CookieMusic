appId: io.github.Cookie-Star-Jewel.cookiemusic
productName: CookieMusic

# 直接用本地 npm electron 包的 dist（跳过 zip 下载解压——那条链路在受管
# 环境有稳定复现的 unlink 竞态 EBUSY）
electronDist: node_modules/electron/dist

# extraResources 搬运 .next/standalone 时会剥掉 node_modules，pack 完成后由本钩子补拷
afterPack: scripts/after-pack.cjs

directories:
  # 工作区内目录会被文件 watcher/索引器长期锁住（unlink EBUSY），移到工作区外
  output: release/

# 壳模式：asar 里只装 electron 壳代码；standalone server 通过 extraResources 携带
files:
  - electron/**/*
  - package.json
  - "!node_modules/**/*"

extraResources:
  # 注意：.next3/standalone 在受管环境里不只是 Next 追踪产物——工作区里的
  # 大目录（release/ 含旧安装包与 win-unpacked）也会被一起 trace 进去，
  # 曾经的 0.4.23 安装包因此从 141MB 涨到 394MB。这里用 filter 兜底排除；
  # 同时 next.config.ts 的 outputFileTracingExcludes 也在源头挡一道。
  - from: .next3/standalone
    to: server
    filter:
      - "**/*"
      - "!release/**"
      - "!.git/**"
      - "!.next3/**"
      - "!.next2/**"
      - "!.workbuddy/**"
      - "!docs/**"
      - "!dist_electron/**"
      - "!android-app/**"
      - "!**/*.tsbuildinfo"
      - "!**/*.log"
  - from: .next3/static
    to: server/.next/static
  - from: public
    to: server/public

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CookieMusic
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
